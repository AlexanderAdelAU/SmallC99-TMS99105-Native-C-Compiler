name: SMALLC99 OVL99 integration Windows build

on:
  push:
    branches:
      - ovl99-smallc99-integration
    paths:
      - 'src/**'
      - 'include/**'
      - 'toolchain/**'
      - 'lib/**'
      - 'make_smallc99.ps1'
      - 'OVLMAP.TXT'
      - 'tools/**'
      - '.github/workflows/ovl99-smallc99.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated destination required by the unmodified SMALLC99 build
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'C:\Development-W11DEV\Eclipse Workspace\TMS99105_SBC\MONITOR' | Out-Null
      - name: Compile, assemble and link SMALLC99 (link99 -Y builds the overlay table)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell -NoProfile -ExecutionPolicy Bypass -File .\make_smallc99.ps1
          if ($LASTEXITCODE -ne 0) { throw "SMALLC99 build failed, exit $LASTEXITCODE" }
          if (-not (Test-Path 'build_tms/SMALLC99.EXE')) {
            throw 'SMALLC99.EXE was not produced'
          }
      - name: Retain executable for emulator and SBC comparison
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: smallc99-ovl99-cross-build
          path: |
            build_tms/SMALLC99.EXE
            build_tms/CC_STMT_R.A99
            build_tms/CC_STMT_R.LST
            build_tms/CC_STMT_R.L99
            build_tms/OVLGLUE.R99
            build_tms/LINK.LOG
          if-no-files-found: error
